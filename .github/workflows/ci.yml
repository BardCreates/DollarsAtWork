name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore server/DollarsAtWork.Api
      - run: dotnet build server/DollarsAtWork.Api --no-restore --configuration Release -warnaserror

  client:
    name: Client test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
