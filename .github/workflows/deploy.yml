# Builds the web app into wwwroot, publishes the API, and deploys both to one Azure App Service.
#
# One-time setup in GitHub: Settings > Secrets and variables > Actions
#   AZURE_WEBAPP_NAME             the App Service name (e.g. dollarsatwork)
#   AZURE_WEBAPP_PUBLISH_PROFILE  the publish profile XML downloaded from the App Service's Overview page
#
# Runtime settings (connection string, Resend, Stripe) are NOT here: set them on the App Service under
# Settings > Environment variables, with __ between levels, e.g. Stripe__SecretKey. Program.cs refuses to start
# in production if any of them is missing.

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Web app — install, check, test, build into wwwroot
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: API — publish
        run: dotnet publish server/DollarsAtWork.Api -c Release -o publish

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
