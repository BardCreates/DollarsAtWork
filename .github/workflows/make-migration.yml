# TEMPORARY: generates the EF migration for this branch with the real dotnet-ef tool and commits it back.
name: Make migration
on:
  push:
    branches: [feature/blog-sales]
    paths: [.github/workflows/make-migration.yml]
permissions:
  contents: write
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore server/DollarsAtWork.Api
      - run: dotnet ef migrations add AddSignupSource --project server/DollarsAtWork.Api --output-dir Data/Migrations
        env:
          ASPNETCORE_ENVIRONMENT: Development
      - run: dotnet build server/DollarsAtWork.Api --configuration Release -warnaserror
      - name: Commit the migration back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/DollarsAtWork.Api/Data/Migrations
          git commit -m "Add the AddSignupSource migration (generated by dotnet-ef)"
          git push
