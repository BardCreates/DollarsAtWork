# TEMPORARY: generates the EF migration for this branch with the real dotnet-ef tool and uploads it.
# Removed again before merging.
name: Make migration

on:
  push:
    branches: [feature/home-hints-help]
    paths: [.github/workflows/make-migration.yml]

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet ef migrations add AddWaitlistAndHints --project server/DollarsAtWork.Api --output-dir Data/Migrations
        env:
          ASPNETCORE_ENVIRONMENT: Development
      - run: dotnet build server/DollarsAtWork.Api --configuration Release -warnaserror
      - uses: actions/upload-artifact@v4
        with:
          name: migration
          path: server/DollarsAtWork.Api/Data/Migrations/
